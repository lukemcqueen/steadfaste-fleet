# ops/install/harnesses/registry.yaml
#
# THE SINGLE SOURCE for coding-agent harness integration.
#
# Everything else in this tree is DERIVED: a harness's README, its shim script
# and its verify steps are generated from the entry below, so adding harness
# #37 is one entry plus `generate-harnesses.py` — never a hand-written bespoke
# shim. That is ADR-0005's rule ("ONE standard shim, generated per agent, never
# hand-written bespoke per agent") applied to context integration.
#
#   generate-harnesses.py --check     # CI/doctor: is every derived file current?
#   generate-harnesses.py --report    # coverage: declared vs actually wired
#
# WHY A REGISTRY, NOT PER-HARNESS DIRECTORIES OF PROSE: with ~100 harnesses the
# failure mode is not "no docs", it is "100 docs that disagree". A registry makes
# disagreement impossible — there is one place a harness's layer is stated.
#
# layer:
#   mcp            harness reads an MCP server from its own config
#   cli-extension  harness has NO MCP client; it needs an extension/shim that
#                  shells out to the shared CLI (Pi is the canonical example)
#   cli-hook       harness only needs a lifecycle command run at a boundary
#   none           declared as unsupported, with the reason — so the gap is
#                  visible instead of silently absent
#
# REQUIRED AGENT SET (operator, 2026-11-23): the fleet must support
#   claude · codex · copilot · cursor · opencode · pi · docker agent
# Every one of those seven is a declared entry in this file. `status: planned`
# means DECLARED, NOT WIRED: the requirement is recorded and the gap is visible
# to the doctor/report instead of silently absent. Coverage:
#   python3 generate-harnesses.py --report
version: 1

defaults:
  # Every non-MCP harness goes through this one CLI (never a bespoke script).
  cli: fleet-context
  cli_path: ~/.steadfaste-fleet/scripts/fleet-context.py
  mcp_server: ~/steadfaste-fleet/mcp-servers/fleet-context-mcp.py
  # The trigger half: the harness owns WHEN a checkpoint is written.
  trigger: ~/.steadfaste-fleet/scripts/session-autocheckpoint.py
  impl: ops/services/mycortex-mem/context_tools.py
  env:
    - FLEET_SESSION_HARNESS
    - FLEET_SESSION_REPO
    - FLEET_SESSION_BRANCH
  # macOS: the interpreter may not be on Pi's PATH (Homebrew python lives at
  # /opt/homebrew/bin on Apple Silicon, /usr/local/bin on Intel) — override it.
  env_optional:
    - FLEET_CONTEXT_CLI
    - FLEET_CONTEXT_PYTHON

harnesses:
  - name: pi
    layer: mcp
    status: shipped
    # PRESENCE (what the doctor gates on): the harness's own artifact on THIS host.
    # Declared here because the registry is the ONE source of harness knowledge — a
    # second copy in the doctor would go stale the moment a harness is added.
    presence:
      - ~/.pi/agent
    surface: 'MCP (fleet-context) + pi.on("tool_call" write gate | "turn_end" | "before_agent_start" | "session_before_compact")'
    why: |
      Pi 1.0.0 HAS an MCP client (verified on the host with `pi mcp list`, which
      lists the connected servers and their tools), so the memory/session TOOLS
      come from the SAME MCP server Claude Code and Codex use — one
      implementation, schemas DERIVED from the contract, nothing per-harness left
      to drift. The extension is kept for the half MCP CANNOT provide: WHEN a
      checkpoint is written (turn_end / before_agent_start / session_before_compact).

      This entry used to be `cli-extension` for BOTH halves, with the tools
      registered by hand as `{ run: async (input) => … }`. When Pi moved
      0.87.1 → 1.0.0 that shape became invalid and every memory/session call
      failed SILENTLY with "definition.execute is not a function" while the store
      was perfectly healthy. The hand-written parameter maps were also a SECOND
      definition of tools that already existed in the contract. One way in per
      capability, or one of the two becomes a phantom.

      (Governance is a separate capability — see `capabilities.governance`.)
    artifact:
      - extensions/fleet-context.ts
      - extensions/fleet-governance.ts
    triggers:
      turn_end: checkpoint (the trigger — MCP cannot provide this)
      before_agent_start: restore + inject the checkpoint
      session_before_compact: checkpoint before continuity is lost
    install: |
      # USER SCOPE — every Pi project, one registration (recommended):
      bash ~/steadfaste-fleet/ops/scripts/install/install-pi-mcp.sh          # the TOOLS (MCP)
      bash ~/steadfaste-fleet/ops/scripts/install/install-pi-integration.sh  # the TRIGGERS + skills
      # PROJECT SCOPE — one repo, files copied in + a generated run line:
      fleet harness install pi --dir <your-pi-project>
      # (equivalent, manual: mkdir -p extensions && cp <harnesses>/pi/extensions/fleet-context.ts extensions/)
    install_ops:
      - mkdir: extensions
      - copy:
          from: pi/extensions/fleet-context.ts
          to: extensions/fleet-context.ts
      - copy:
          from: pi/extensions/fleet-governance.ts
          to: extensions/fleet-governance.ts
    # A capability is what a harness must be wired to; the layer above is only
    # its CONTEXT half. Declaring skills/governance here is the difference
    # between "registered somewhere" and "registered the same way" — each names
    # the one script that registers it and how to prove it landed.
    capabilities:
      context:
        adapter: mcp
        register: ops/scripts/install/install-pi-mcp.sh
        from: fleet-context-mcp.py
        requires: "pi >= 0.99 (MCP client) — detected on the host, never assumed from a version in a doc"
        why: |
          The tools are the SHARED server, so Pi is not special: same schemas,
          same semantics, one place to fix. The lifecycle triggers stay in the
          extension because MCP has no lifecycle — a harness that owns "when"
          cannot be replaced by a tool surface.
        verify:
          - 'pi mcp list shows fleet-context with the memory/session tools.'
          - 'In a Pi session call mem_context — the peer card must come back.'
      skills:
        adapter: discovery
        register: ops/scripts/install/install-pi-integration.sh
        from: skills.yaml#always
        why: |
          Pi advertises each skill's NAME + DESCRIPTION at startup and loads the
          body on demand, so it must be pointed at a CURATED set — wiring the
          whole ~400-skill library in is a self-inflicted context wound. The set
          is DERIVED from the skills manifest's `always:` section (the same one
          definition Hermes loads), and registered at USER scope in
          ~/.pi/agent/settings.json — the same one-file pattern the MCP servers
          already use, instead of re-copying flags per repo.
        verify:
          - 'bash ops/scripts/install/install-pi-integration.sh --check exits 0.'
          - 'Pi shows the always-skills as /skill:<name> commands (startup diagnostics).'
          - 'fleet-update.sh runs the installer on any host where Pi is present (~/.pi/agent), and the doctor reports it as `Pi integration` (PASS / WARN / absent). Verification evidence lives in docs/evidence/, not here.'
      governance:
        # VERSION-AWARE (2026-10-02). `adapter: mcp` below is the PREFERRED route, but
        # it needs an MCP-capable Pi — detected from the CLI's own help, not assumed: on Pi 0.87.1 the CLI exposed no
        # 'mcp' subcommand (pi --help has ZERO matches for mcp) and there is no
        # ~/.pi/agent/mcp.json. Do NOT infer this from 'pi mcp list' — that command
        # errors on authentication BEFORE it can report MCP status, so an auth failure
        # is not evidence about MCP availability (a probe that never ran is not a
        # negative result). Declaring only the MCP route left an agent on an older Pi
        # with a register command it cannot run and a verify step ("pi mcp list shows…")
        # that fails for a reason unrelated to governance — and would reasonably
        # conclude governance is unavailable. Both routes reach the SAME
        # implementation: the gates and the governance DB are host state, so a Pi
        # commit is governed identically either way.
        adapter: mcp
        register: ops/scripts/install/install-pi-mcp.sh
        from: loop-gov-mcp.py
        requires: "pi >= 0.99 (MCP client)"
        fallback:
          adapter: cli
          requires: "any Pi version — the installed version is detected on the host, not assumed"
          register: "(none — core.hooksPath is global, and loop-gov.py is deployed with the rest of ops/scripts)"
          from: loop-gov-mcp.py
          why: "A Pi commit runs the SAME gates as a Hermes commit (core.hooksPath is a
            \ global git config, so the hooks are not harness-specific), and
            \ loop-gov.py --list exposes the full governance toolset — begin_change,
            \ end_change, check_lock, cycle_query, feedback_accept/override — as a
            \ generic CLI over the one MCP implementation, so a Pi agent without MCP
            \ can run the entire ritual."
          verify:
          - git config --get core.hooksPath prints ~/.steadfaste-fleet/hooks — so a commit made from a Pi session is gated.
          - python3 ~/.steadfaste-fleet/scripts/loop-gov.py --list lists begin_change and end_change.
          - "The CLI works under EVERY interpreter shape, and the skew that broke gisu (2026-10-20) is now a WARNING, not a failure — with no `mcp` at all the handlers run through their own stand-ins, with mcp>=2.0 the SDK is used, and an mcp in between (importable but too old for the 2.0 constructor API this server registers handlers with) used to kill the module at import and make the CLI exit 3 on every write gate, which read as governance being unavailable. It now prints on stderr `[mcp-server] WARNING: the installed MCP SDK cannot serve this module (<error>) — stdio serving is DISABLED; the CLI adapter still works` and the CLI exits 0/1 as usual. Seeing that warning means THE INTERPRETER's mcp is behind — the extension spawns FLEET_GOVERNANCE_PYTHON, defaulting to `python3` from pi's PATH — not that governance is down. Fix it by running the CLI with ~/.steadfaste-fleet/venv/bin/python3, or repair that venv with `python3 ops/scripts/manage/fix-fleet-venv.py` (its --check probes this capability, not just the import)."
          - python3 ~/.steadfaste-fleet/scripts/loop-gov.py check_lock returns a JSON status object (the CLI reaches the governance store). Note: its 'active' field is NOT the test the push gate uses — a lock FILE can exist (and permit a push) while check_lock reports inactive, so an inactive reading must not be taken as permission to push.
          - python3 ~/.steadfaste-fleet/scripts/loop-gov.py begin_change '{"task_id":"pi-smoke","description":"probe"}' returns a cycle id and end_change releases it — run this only when you hold no other lock.
        why: |
          Pi >= 0.99 gained an MCP client and reads user-scope servers from
          ~/.pi/agent/mcp.json, so the five cortex servers (loop-governance,
          tasks, executor, agent-bus, fleet-context) register exactly like Claude
          Code's — one
          implementation, one way in per harness. On an older Pi with no MCP
          client the commit-time git hooks STILL govern (core.hooksPath is
          global, so a Pi commit runs the same gates as a Hermes one), and
          ops/scripts/loop-gov.py is the CLI way in for the interactive ritual.
        verify:
          - 'pi mcp list shows loop-governance, tasks, executor, agent-bus, fleet-context.'
          - 'A commit made from a Pi session passes the hooks (or names the gate it hit).'
      governance-gate:
        # THE GAP THIS CLOSES (2026-10-14, titus). Hermes enforces governance at the
        # TOOL level via its enforcer plugin, which runs inside the Hermes agent
        # loop. Pi's read/bash/edit/write are pi-NATIVE and never cross it, and the
        # loop-governance MCP server is a tool SURFACE — it can hand the agent
        # begin_change but it cannot see a native write. So a Pi session could edit
        # and write files with NO lock. The commit-time hook IS a second layer, but
        # its lock check is scoped to the steadfaste-fleet repo only, so a Pi session
        # in a PROJECT repo had no lock gate at write OR commit time.
        #
        # This is the INTERACTIVE gate (a native tool call); `governance` above is
        # how the agent REACHES the tools. Both are needed and neither implies the
        # other — they are separate capabilities for that reason.
        adapter: extension
        register: ops/scripts/install/install-pi-integration.sh
        from: pi/extensions/fleet-governance.ts
        requires: 'pi whose tool_call hook can block — verified by loading the extension through pi''s own loader, never assumed from a version in a doc'
        why: |
          The extension registers ONLY a tool_call handler and adds NO governance
          semantics: it asks the SHARED implementation (loop-gov.py over
          loop-gov-mcp.py's `check_repo_lock` predicate) and blocks the call when
          that refuses. Re-implementing "does a lock cover this repo" per harness
          is how the rule stops binding — the git hook already carries one copy.
          Bash is classified by a read-only ALLOWLIST, deny by default, never by
          shell syntax: `cp`, `mv`, `rm`, `tee`, `dd` contain no metacharacter, so a
          syntax-based rule let every one of them through. Every cannot-verify path
          (CLI missing, governance unreachable, no repo resolvable) fails CLOSED,
          with the cost stated in the message and no agent-side override.
        verify:
          - 'node ops/install/harnesses/pi/verify-governance-extension.mjs exits 0 — it EXECUTES the gate, asserts both directions, and includes the no-metacharacter write commands.'
          - 'loop-gov.py check_repo_lock against the session repo exits 0 while a lock covers it and 1 when none does.'
          - 'In a Pi session with no lock a write is refused with GOVERNANCE LOCK REQUIRED; after begin_change the same write succeeds.'
      gateway:
        adapter: command
        register: ops/scripts/install/install-pi-mcp.sh
        from: ops/scripts/fleet_gateway/agents.py
        requires: "pi >= 0.99 (MCP client); the `command` backend only needs the pi binary"
        why: |
          The fleet-gateway daemon (ops/scripts/fleet_gateway/) exposes two kinds:
          `hermes` (bus adapter — inbox_<a>/out_<a>) and `command` (spawn a CLI per
          dispatch). For an agent whose harness is Pi, the canonical backend is
          `command` shelling out to `pi` — proven live on the second bot with the
          full slash/streaming/typing surface (CR5,
          docs/design/fleet-gateway-parity.md §CR5, 32 slash-parity tests). The
          MCP half is already shipped: agent-bus MCP is registered by the same
          install-pi-mcp.sh script the harness already uses, so a Pi-hosted Titus
          reaches the bus reply path the same Hermes-hosted agent does.
        verify:
          - 'pi mcp list shows agent-bus (so the reply leg writes to out_<titus>).'
          - 'gateway.yaml has an agents.titus entry with backend=command and the pi binary on PATH.'
          - 'gateway-titus-pi.example.yaml applies cleanly to a host with pi; the doctor adds a Titus pi gateway PASS row.'
          - 'fleet-update.sh runs the installer on any host where pi is present and reports `Titus pi gateway` in the doctor.'
    # Built-in tools only: the memory/session surface is NOT a --tools entry any
    # more — it arrives over MCP, so there is no per-harness tool list left to
    # rot when the contract grows.
    tools_base: [read, bash, edit, write]
    run: |
      pi   # tools come from ~/.pi/agent/mcp.json (install-pi-mcp.sh)
    verify:
      - 'pi mcp list shows fleet-context with the memory/session tools.'
      - 'In a Pi session call mem_context — the peer card must come back.'
      - 'Let a turn end with a decision, then: fleet-context session_restore "{}" | grep <marker>'
      - 'Start a second session; the checkpoint must appear unasked (`FLEET_RESUME` in `~/.steadfaste-fleet/logs/pi-context.log`).'
      - 'node ops/install/harnesses/pi/verify-governance-extension.mjs exits 0 — it EXECUTES the write gate and asserts both directions.'
      - 'In a Pi session, with no lock: writing a file is refused with GOVERNANCE LOCK REQUIRED; after begin_change it succeeds.'
    # The extension's own knobs. Routine markers go to the cortex log, never the
    # prompt area, so a diagnosing agent needs to know where to look.
    env_optional:
      - FLEET_CONTEXT_CLI
      - FLEET_CONTEXT_PYTHON
      - {FLEET_CONTEXT_LOG: 'default: ~/.steadfaste-fleet/logs/pi-context.log'}
      - {FLEET_CONTEXT_LOG_MAX_BYTES: 'default: 1 MiB; rotates to <log>.1'}
      - {FLEET_CONTEXT_DEBUG: '1 = echo routine markers to stderr while diagnosing'}

  - name: hermes
    layer: mcp
    status: shipped
    presence:
      - ~/.hermes/config.yaml
    surface: 'hermes mcp add'
    why: Hermes reads MCP servers from config, so it needs no shim at all.
    install: |
      hermes mcp add fleet-context \
          --command ~/.steadfaste-fleet/venv/bin/python3 \
          --args ~/steadfaste-fleet/mcp-servers/fleet-context-mcp.py
    verify:
      - 'hermes mcp list | grep fleet-context'
      - 'Call mcp__fleet_context__mem_context; the peer card must come back.'
    capabilities:
      context:
        adapter: mcp
        register: ops/scripts/install/install-hermes-mcp.sh
        from: fleet-context-mcp.py
        requires: "hermes-agent >= 0.15 (sessions-fleet key + hooks, injected into MCP children)"
        why: |
          One registration covers every server surface Hermes needs from the fleet
          (fleet-context, agent-bus, tasks, executor). The installer is idempotent
          and fails closed: absent tokens stay absent and are reported by name.
      skills:
        adapter: deploy
        register: ops/scripts/fleet-update.sh
        why: |
          Hermes skills are the deployed tree symlinked into ~/.hermes/skills — there
          is no per-session registration step. The deploy is the adapter, so a broken
          skills surface is a deploy fault, not a registration fault.
      governance:
        adapter: plugin+mcp
        register: ops/scripts/fleet-update.sh
        why: |
          The governance-enforcer plugin and the review/loop-governance MCP servers
          are shipped by the deploy. Hooks are governed by the fleet's own hook
          checks (check_governance, check_hook_drift) rather than a harness adapter.
    triggers:
      note: 'Harness side: ops/scripts/session-autocheckpoint.py at a boundary, or a cron.'

  - name: claude-code
    layer: mcp
    status: shipped
    presence:
      - ~/.claude.json
      - ~/.claude/settings.json
      - cmd:claude
    surface: '.mcp.json'
    why: |
      MCP-native; registration is a config entry, no shim. The harness also
      reaches the bus reply path through agent-bus MCP — both server
      registrations are written by `install-claude-mcp.sh`, mirroring the pi
      installer. Per `cross-agent-design > references/harness-session-identity.md`
      (verified 2026-11-11): Claude Code injects `CLAUDE_CODE_SESSION_ID` into
      stdio MCP children since v2.1.154, so the resolver answers "env, unique"
      once the harness lifecycle hook sets `FLEET_SESSION_KEY`. The `command`
      backend in gateway.yaml (`command: ["claude"]`) is the SAME door as pi —
      no daemon, transport, or backend code change.
    install: |
      # USER SCOPE — every Claude Code session, one registration (recommended):
      bash ~/steadfaste-fleet/ops/scripts/install/install-claude-mcp.sh
    capabilities:
      context:
        adapter: mcp
        register: ops/scripts/install/install-claude-mcp.sh
        from: fleet-context-mcp.py
        requires: "claude-code >= 2.1.154 (CLAUDE_CODE_SESSION_ID reaches MCP children)"
        why: |
          Same as the pi entry — the MCP server is the shared implementation;
          Claude Code is not special. Registration is a config entry (no shim).
        verify:
          - 'claude mcp list shows fleet-context with the memory/session tools.'
          - 'In a Claude Code session call mem_context — the peer card must come back.'
      skills:
        adapter: deploy
        register: ops/scripts/fleet-update.sh
        why: |
          Claude Code reads skills from the published agent-visible tree
          (~/.agents/skills → the deployed fleet skills) exactly as Hermes does;
          there is no per-session registration step. The deploy is the adapter,
          so a broken skills surface is a deploy fault, not a registration fault.
      governance:
        adapter: mcp
        register: ops/scripts/install/install-claude-governance.sh
        from: loop-gov-mcp.py
        requires: "claude-code with a user-scope mcpServers config"
        why: |
          install-claude-governance.sh registers the governance MCP servers
          (loop-governance, review, tasks, executor, agent-bus) at USER scope in
          ~/.claude.json so every Claude Code commit is governed — the same
          one-server-per-role shape the Hermes config uses. Registration writes
          through Claude's own config, never a raw edit of a security-sensitive
          file.
      gateway:
        adapter: command
        register: ops/scripts/install/install-claude-mcp.sh
        from: ops/scripts/fleet_gateway/agents.py
        requires: "claude-code >= 2.1.154 (CLAUDE_CODE_SESSION_ID reaches MCP children); the gateway config has agents.titus with backend=command"
        why: |
          Same shape as the pi gateway capability — the `command` backend
          shelling out to `claude <args>` is the SAME CommandBackend class. The
          MCP half ships agent-bus so the bus reply path is wired. The
          slash-command path (`/new`, `/model`, `/compact`, `/restart`) lives
          in the gateway (the harness-only `/model` UI is unrelated), and
          Claude Code's compact lives in its RPC mode, so the gateway uses
          `commands.compact` to invoke `claude_control.py` (deployed beside
          `pi_control.py`).
        verify:
          - 'claude mcp list shows fleet-context AND agent-bus.'
          - 'gateway.yaml has `agents.titus` with backend=command and the claude binary on PATH.'
          - 'gateway-titus-claude.example.yaml applies; the doctor adds "Titus claude gateway" PASS.'
          - 'fleet-update.sh runs the installer on any host where claude is present and reports `Titus claude gateway` in the doctor.'
    tools_base: [Read, Bash, Edit, Write]
    run: |
      claude   # tools come from ~/.claude.json (install-claude-mcp.sh)
    verify:
      - 'claude mcp list shows fleet-context AND agent-bus.'
      - 'In a Claude Code session call mem_context — the peer card must come back.'
      - 'env | grep CLAUDE_CODE_SESSION_ID is non-empty (so the resolver answers env,unique).'
      - 'gateway-titus-claude.example.yaml applies cleanly; the doctor reports `Titus claude gateway` PASS.'

  - name: codex
    layer: mcp
    status: documented
    presence:
      - ~/.codex/config.toml
      - cmd:codex
    surface: '~/.codex/config.toml [mcp_servers]'
    why: MCP-native; registration is a config entry, no shim.
    install: |
      Add to ~/.codex/config.toml:
        [mcp_servers.fleet-context]
        command = "python3"
        args = ["<mcp_server>"]
    verify:
      - 'codex mcp list shows fleet-context'
      - 'Call mem_context; the peer card must come back.'
    capabilities:
      context:
        adapter: mcp
        register: ops/scripts/install/install-codex-mcp.sh
        from: fleet-context-mcp.py
        why: |
          Same shared server; registration is a [mcp_servers] entry in
          ~/.codex/config.toml. The installer is idempotent and reports what it
          added, already had, or could not add.

  # ── Required agent set, declared but NOT yet wired (operator, 2026-11-23) ──
  # These four carry `status: planned` on purpose: the operator's requirement is
  # recorded so the gap is visible, and the layer below is evidence from each
  # vendor's OWN docs (read 2026-11-23) — the wiring has NOT been exercised on a
  # live host. Do not read a planned entry as "supported"; read it as "declared,
  # install steps named, verification owed". Promote to `documented`/`shipped`
  # only after the verify steps below have been run on a host with the tool.

  - name: copilot
    layer: mcp
    status: planned
    presence:
      - ~/.copilot/mcp-config.json
      - cmd:copilot
    surface: '~/.copilot/mcp-config.json [mcpServers] (or `copilot mcp add`)'
    why: |
      GitHub Copilot CLI is MCP-native: it reads servers from
      ~/.copilot/mcp-config.json, so its TOOL surface needs no shim — the same
      shared fleet-context MCP server Claude Code, Codex and Pi use. Declared
      from GitHub's own CLI docs ("Adding MCP servers for GitHub Copilot CLI",
      read 2026-11-23), which also document `copilot mcp list` as the read-back.

      OWED BEFORE `documented`: which env var carries the harness's session id
      into the MCP child is UNVERIFIED for Copilot CLI (see the per-harness
      table in the cross-agent-design skill). If none reaches the child the
      resolver answers "per-repo, shared" — a real defect for lock ownership,
      not a cosmetic one.
    install: |
      copilot mcp add fleet-context -- \
          ~/.steadfaste-fleet/venv/bin/python3 <mcp_server>
      # (equivalent: add the [mcpServers] entry to ~/.copilot/mcp-config.json)
    verify:
      - 'copilot mcp list shows fleet-context (and agent-bus once the reply path is wired).'
      - 'In a Copilot CLI session call mem_context — the peer card must come back.'
      - 'copilot ... session identity: the resolver must answer env,unique, not per-repo/shared (`fleet-context session_identity` style probe) — UNVERIFIED until run.'

  - name: cursor
    layer: mcp
    status: planned
    presence:
      - ~/.cursor/mcp.json
      - cmd:cursor
    surface: '~/.cursor/mcp.json [mcpServers] (project: .cursor/mcp.json)'
    why: |
      Cursor (IDE and the `agent` CLI) is MCP-native and the two share ONE
      config: servers declared in ~/.cursor/mcp.json (global) or
      .cursor/mcp.json (project), merged with project taking precedence.
      Declared from Cursor's own MCP docs (read 2026-11-23). Registration is a
      config entry, so the layer matches the shared server — no shim.
    install: |
      Add to ~/.cursor/mcp.json (global) or .cursor/mcp.json (project):
        { "mcpServers": { "fleet-context": {
            "command": "<fleet venv python>", "args": ["<mcp_server>"] } } }
      # read back:  agent mcp list   (same servers as the editor's Customize > MCPs)
    verify:
      - 'agent mcp list shows fleet-context.'
      - 'In a Cursor session call the fleet-context tools; mem_context returns the peer card.'
      - 'Session identity (which env var reaches the MCP child) is UNVERIFIED for Cursor — resolve it before promoting this entry.'

  - name: opencode
    layer: mcp
    status: planned
    presence:
      - ~/.config/opencode/opencode.json
      - cmd:opencode
    surface: '~/.config/opencode/opencode.json "mcp": {"servers": {…}}'
    why: |
      OpenCode is MCP-native with its own config shape: MCP servers live under
      the top-level `mcp.servers` key of ~/.config/opencode/opencode.json (or a
      project opencode.json). Declared from OpenCode's own config docs (read
      2026-11-23). Local servers take a `command` ARRAY (not a string), so this
      entry cannot be a copy of the Claude/Codex one — the shape is the
      harness's own.
    install: |
      Add to ~/.config/opencode/opencode.json:
        { "mcp": { "servers": { "fleet-context": {
            "type": "local",
            "command": ["<fleet venv python>", "<mcp_server>"] } } } }
    verify:
      - 'The fleet-context server appears in OpenCode''s MCP view and its tools are callable.'
      - 'In an OpenCode session call mem_context — the peer card must come back.'
      - 'Session identity is UNVERIFIED for OpenCode — resolve it before promoting this entry.'

  - name: docker-agent
    layer: mcp
    status: planned
    presence:
      - cmd:cagent
    surface: 'cagent agent YAML — toolsets: [{type: mcp, ref: <server>}]'
    why: |
      Docker Agent (cagent, and the Docker Agent surface in Docker Desktop) is
      declared as a REQUIRED harness by the operator. Its MCP consumption is
      declarative: an agent definition lists toolsets, and an MCP server is one
      of those toolset types (Docker's cagent docs, read 2026-11-23), so the
      shared fleet-context server is reachable without a shim.

      The exact server reference form (a `cagent mcp` registry entry vs a
      literal command in the toolset block) is NOT yet verified on a host —
      the toolset TYPE is documented, the ref spelling is not. Resolve it by
      reading cagent's own `--help`/docs on a host with the binary; never guess
      the key.

      IDENTITY NOT CONFIRMED: "docker agent" is taken to mean Docker's agent
      CLI (cagent), whose own binary is the presence declared here. If the
      operator means instead Docker Desktop's agent surface or a
      container-hosted agent, say so and re-point this entry — the layer would
      be the same (MCP) but `presence:` must name the artifact the doctor can
      actually find, or the entry reports SKIP forever on a host that has it.
    install: |
      In the agent definition (cagent.yaml), add the fleet-context MCP server to
      the agent's toolsets:
        agents:
          root:
            toolsets:
              - type: mcp
                ref: fleet-context      # exact ref form UNVERIFIED — confirm
    verify:
      - 'cagent runs an agent whose toolsets include fleet-context and the fleet-context tools are listed.'
      - 'In that session call mem_context — the peer card must come back.'

